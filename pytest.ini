[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests